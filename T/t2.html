
<!DOCTYPE html>
<html lang="en">
    <head>
        <title>"Page"</title>
        <link rel="stylesheet" href="t2.css">
    </head>
    <body>
        <nav class ="nav" >
            <div class ="title">
                <h1 style="color: red;">My Website</h1>
            </div>
            <div class="links">
                <a href="#Home">Home</a>
                <a href="#About">About</a>
                <a href="#Contact">Contact</a>
            </div>
        </nav>
        <section id="Home">
            <h1>Home</h1>
            <h2></h2>
            <p>Welcome to my website! This is the home section.</p>
            <form action ="/submit" method="post">
                <label for="name">Name:</label>
                <input type="text" id="name" name="name" required>
                <label for="email">Email:</label>
                <input type="email" id="email" name="email" required>
                <label for="message">Message:</label>
                <textarea id="message" name="message" required></textarea>
                <button type="submit">Send</button>
            </form>
            </section>
        <section id="About">
            <h1>About</h1>
            <p>This is the about section. Here you can learn more about me.</p>
        </section>
        <section id="Contact">
            <h1>Contact</h1>
            <p>This is the contact section. Feel free to reach out!</p>
        </section>
    </body>
</html>
