<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Form</title>


</head>

<body>

    <header class="page">
        <h1>Contact</h1>
    </header>

    <nav class="page">
        <ul>
            <li><a href="#home">Home</a></li>
            <li><a href="#about">About</a></li>
            <li><a href="#contact">Contact</a></li>
        </ul>
    </nav>

    <main>


        <section class="page" id="contact">
            <h2>Contact Form</h2>

            <form action="/submit-form" method="POST">

                <label for="name">Name:</label>
                <input type="text" id="name" name="name" required>

                <br><br>

                <label for="email">Email:</label>
                <input type="email" id="email" name="email" required>

                <br><br>

                <label for="message">Message:</label>
                <textarea id="message" name="message" required></textarea>

                <br><br>

                <button type="submit">Submit</button>

            </form>
        </section>

    
        <section class="page">
            <h2>Image Gallery</h2>

            <div class="gallery">

                <img src="https://media.istockphoto.com/id/1136834574/photo/watzmann-in-alps-dramatic-reflection-at-sunset-national-park-berchtesgaden.jpg?s=612x612&w=0&k=20&c=TpbhKprAFth2Lss7ZCiK7R4d2N-YKt0d9Kh3BSpg9eI="
                     alt="A beautiful sunset over the mountains">

                <img src="https://thumbs.dreamstime.com/b/aerial-view-serene-beach-crystal-clear-waters-lush-greenery-beautiful-landscape-showcases-turquoise-white-sands-358988163.jpg"
                     alt="A serene beach with crystal clear water">

                <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSknO6ORh0UG7RAFPybYHmFxdAwMdNS8RBxk5smuUmy5A&s=10"
                     alt="A dense forest with sunlight filtering through the trees">

                <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSWSumPC-krWw7EkmjoZ_FcCYLl1oH8XCe-oG0hNzzxVQ&s=10"
                     alt="A city skyline at night with bright lights">

            </div>
        </section>

    </main>

    <footer class="page">
        <p>&copy; All rights reserved.</p>
    </footer>

</body>
</html>
